name: Website

# Publishes site/ to GitHub Pages after CI passes on main, so a failing test
# (including the website's staleness checks) blocks the deploy. Page data is
# committed (regenerate with `uv run python scripts/export_site_data.py`), so
# deploying needs no Python.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A delayed or rerun CI build of an older commit would otherwise roll the
  # site back, so deploy only a commit that is still main's tip. The `pages`
  # concurrency group runs each workflow run (check and deploy) to completion
  # before the next starts, so a newer deploy cannot land in between.
  tip:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$CANDIDATE" = "$tip" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $CANDIDATE: main is now at $tip."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the site
        run: make -C site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

      - id: deployment
        uses: actions/deploy-pages@v4
