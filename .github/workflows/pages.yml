name: Website

# Publishes site/ to GitHub Pages. Page data is committed (regenerate with
# `uv run python scripts/export_site_data.py`), so deploying needs no Python.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "manuscript/main.pdf"
      - "manuscript/figures/main/figure01.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the JavaScript diagnostics against the Python reference
        run: make -C site test

      - name: Assemble the site
        run: make -C site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

      - id: deployment
        uses: actions/deploy-pages@v4
