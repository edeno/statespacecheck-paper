name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Override the local .python-version pin for every uv invocation.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the viewer's system libraries
        # PySide6 loads these at import even on the offscreen platform.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfreetype6 libfontconfig1

      - name: Install dependencies
        # Use the lockfile's resolution for this Python version and platform.
        run: uv sync --frozen --extra dev --extra interactive

      - name: Verify Python version
        run: uv run --frozen python -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON'], sys.version"

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Test the read-only DataJoint guard against DataJoint
        # The guard protects the lab database, but DataJoint is outside the dev
        # environment, so this step adds the versions uv.lock pins. DataJoint imports
        # pkg_resources, which newer setuptools releases removed.
        if: matrix.python-version == '3.11' && runner.os == 'Linux'
        run: uv run --frozen --with datajoint==0.14.6 --with setuptools==80.9.0 pytest tests/test_datajoint_read_only.py --no-cov

      - name: Type check with mypy
        # Type-check against one set of stubs: the lock resolves numpy 2.2 on
        # Python 3.10 and 2.3 on 3.11+, whose stubs disagree on array shapes
        # (10 errors under 2.2 in code that is clean under 2.3). 3.11 is the development pin
        # (.python-version); the tests still run on every version.
        if: matrix.python-version == '3.11'
        run: uv run mypy src/

      - name: Run tests with pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  site:
    # The website's JavaScript port of the diagnostics must match the Python
    # implementation (site/tests/fixtures/metric_parity.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run site tests
        run: make -C site test

  site-accessibility:
    # Accessibility and keyboard checks of the assembled site in headless
    # Chromium; the Pages deploy waits for every CI job, so a failure blocks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install test dependencies and Chromium
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: make -C site test-browser
