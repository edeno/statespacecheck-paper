name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Override the local .python-version pin for every uv invocation.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Use the lockfile's resolution for this Python version and platform.
        run: uv sync --frozen --extra dev --extra interactive

      - name: Verify Python version
        run: uv run --frozen python -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON'], sys.version"

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        # Type-check against one set of stubs: the lock resolves numpy 2.2 on
        # Python 3.10 and 2.3 on 3.11+, whose stubs disagree on array shapes
        # (10 errors under 2.2 in code that is clean under 2.3). 3.11 is the development pin
        # (.python-version); the tests still run on every version.
        if: matrix.python-version == '3.11'
        run: uv run mypy src/

      - name: Run tests with pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  site:
    # The website's JavaScript port of the diagnostics must match the Python
    # implementation (site/tests/fixtures/metric_parity.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run site tests
        run: make -C site test

  site-accessibility:
    # Accessibility and keyboard checks of the assembled site in headless
    # Chromium; the Pages deploy waits for every CI job, so a failure blocks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install test dependencies and Chromium
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The session explorer's archive (a release asset, named and checksummed
      # by the committed overview); the build downloads it only on a miss.
      - uses: actions/cache@v4
        with:
          path: site/.explorer
          key: site-explorer-${{ hashFiles('site/data/recording_explorer.json') }}

      - name: Run browser tests
        run: make -C site test-browser
